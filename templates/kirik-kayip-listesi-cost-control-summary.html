<div class="ass__summary-grid">
  <article class="ass-summary-card ass-summary-card--qty">
    <div class="ass-summary-card__icon"><i class="pi pi-sort-numeric-down-alt"></i></div>
    <div class="ass-summary-card__body">
      <span class="ass-summary-card__label">Stok Fark Miktarı</span>
      <span class="ass-summary-card__value">{{monthlyCostReports.difference.stockCount}}<small>Adet</small></span>
    </div>
  </article>

  <article class="ass-summary-card ass-summary-card--price">
    <div class="ass-summary-card__icon"><i class="pi pi-wallet"></i></div>
    <div class="ass-summary-card__body">
      <span class="ass-summary-card__label">Stok Fark Fiyatı</span>
      <span class="ass-summary-card__value">{{monthlyCostReports.difference.totalPrice}}<small>TL</small></span>
    </div>
  </article>
</div>
