<div class="ass__hero ass__hero--compare">
  <div class="ass__hero-media ass__hero-media--icon">
    <i class="pi pi-chart-bar"></i>
  </div>
  <div class="ass__hero-main">
    <span class="ass__eyebrow">Devirsiz sayım karşılaştırma</span>
    <h1>Sayım Karşılaştırma Detayı</h1>
    <p class="ass__hero-sub">{{departmentsComparation.:departments:.label}} · {{departmentsComparation.:subDepartments:.name}}</p>
    <p class="ass__hero-meta-line">
      <i class="pi pi-calendar"></i>
      {{departmentsComparation.previousPeriod}}
      <i class="pi pi-arrow-right ass__hero-arrow"></i>
      {{departmentsComparation.period}}
    </p>
  </div>
</div>
