<div class="ass__summary-grid">
  <article class="ass-summary-card ass-summary-card--qty">
    <div class="ass-summary-card__icon"><i class="pi pi-sort-numeric-down-alt"></i></div>
    <div class="ass-summary-card__body">
      <span class="ass-summary-card__label">Toplam Stok</span>
      <span class="ass-summary-card__value">{{reports.totalStockCount}}<small>Adet</small></span>
    </div>
  </article>

  <article class="ass-summary-card ass-summary-card--price">
    <div class="ass-summary-card__icon"><i class="pi pi-wallet"></i></div>
    <div class="ass-summary-card__body">
      <span class="ass-summary-card__label">Toplam Fiyat</span>
      <span class="ass-summary-card__value">{{reports.totalStockPrice}}<small>TL</small></span>
    </div>
  </article>
</div>
