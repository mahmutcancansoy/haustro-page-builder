<div class="ass__hero atr-hero">
  <div class="ass__hero-main">
    <span class="ass__eyebrow">Envanter</span>
    <h1>Geçmiş Transferler</h1>
    <p class="ass__hero-sub">Tamamlanan ve reddedilen transferlerin geçmiş listesi.</p>
  </div>
  <div class="ass__hero-meta">
    {{#if transfers.length}}
      <span class="ass__chip"><i class="pi pi-send"></i> {{transfers.length}} geçmiş kayıt</span>
    {{else}}
      <span class="ass__chip"><i class="pi pi-send"></i> Geçmiş transferler</span>
    {{/if}}
  </div>
</div>
