<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sipariş Takip Revize</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/primeicons/primeicons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --primary-color: #334155;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --success-color: #22c55e;
            /* YENİ CANLI RENK: Amber/Orange */
            --truck-accent: #f59e0b; 
        }

        /* ANA KART YAPISINA DOKUNULMADI */
        .info-card {
            background: white;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            border: 1px solid #e2e8f0;
            margin-bottom: 30px;
        }

        .card-header-modern {
            padding: 15px 25px;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-header-modern h5 { margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--primary-color); }

        /* GÖRSEL ALAN REVİZE */
        .shipping-visual {
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
            height: 150px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
            border-bottom: 1px solid #e2e8f0;
        }

        /* Yol Çizgisi: Daha belirgin ve hareketli */
        .road-dashed {
            position: absolute;
            top: 62%;
            left: 0;
            width: 100%;
            height: 2px;
            background-image: linear-gradient(90deg, #cbd5e1 70%, transparent 30%);
            background-size: 40px 100%;
            z-index: 1;
            animation: roadFlow 15s linear infinite;
        }

        @keyframes roadFlow {
            from { background-position: 0 0; }
            to { background-position: 400px 0; }
        }

        .node { z-index: 2; text-align: center; position: relative; }
        
        .node-icon {
            width: 46px; height: 46px; background: white;
            border: 2px solid #e2e8f0; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 8px; color: #64748b;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .node.dest .node-icon { 
            border-color: var(--success-color); 
            color: var(--success-color);
            background: #f0fdf4;
        }

        /* KAMYON: RENK VE HIZ REVİZE */
        .truck-wrapper {
            position: absolute;
            top: 36%;
            left: -15%;
            /* 12 saniye: Daha ağır ve gerçekçi sevkiyat hızı */
            animation: truckMoveSteady 12s cubic-bezier(0.445, 0.05, 0.55, 0.95) infinite;
            z-index: 3;
            color: var(--truck-accent);
            filter: drop-shadow(0 4px 3px rgba(245, 158, 11, 0.2));
        }

        @keyframes truckMoveSteady {
            0% { left: 12%; opacity: 0; transform: translateX(-20px); }
            10% { opacity: 1; transform: translateX(0); }
            90% { opacity: 1; transform: translateX(0); }
            100% { left: 78%; opacity: 0; transform: translateX(20px); }
        }

        .node-text {
            font-size: 10px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container p-4">

    <div class="info-card">
        <div class="card-header-modern">
            <i class="fa-solid fa-truck-ramp-box"></i>
            <h5>Sipariş Takip Süreci</h5>
        </div>
        
        <div class="shipping-visual">
            <div class="road-dashed"></div>
            
            <div class="node">
                <div class="node-icon"><i class="pi pi-building"></i></div>
                <div class="node-text">{{shippedOrder.:suppliers:.name}}</div>
            </div>

            <div class="truck-wrapper text-center">
                <i class="fa-solid fa-truck-fast fa-2x"></i>
                <div style="font-size: 9px; font-weight: 900; margin-top: 2px; color: var(--primary-color);">YOLDA</div>
            </div>

            <div class="node dest">
                <div class="node-icon"><i class="pi pi-map-marker"></i></div>
                <div class="node-text" style="color: var(--success-color);">
                    {{shippedOrder.:purchases:.:departments:.short}}
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
