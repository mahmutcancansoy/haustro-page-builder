<div class="ass__hero ass__hero--branch">
  <div class="ass__hero-media">
    <img
      class="ass__hero-img"
      src="https://cdn-cms1.hotelrunner.com/cms_files/theme/412150650/page_blocks/uploaded_by_gallery/agatha.jpg"
      alt="{{departments.label}}"
    />
  </div>
  <div class="ass__hero-main">
    <span class="ass__eyebrow">Depo / şube</span>
    <h1>{{departments.label}}</h1>
    <p class="ass__hero-sub">{{departments.short}}</p>
    <p class="ass__hero-meta-line">
      <i class="pi pi-user"></i>
      Müdür: {{departments.:users:manager.name}} {{departments.:users:manager.surname}}
    </p>
  </div>
  <div class="ass__hero-meta">
    <span class="ass__chip"><i class="pi pi-map-marker"></i> {{departments.label}}</span>
    <span class="ass__chip"><i class="pi pi-tag"></i> {{departments.short}}</span>
  </div>
</div>
