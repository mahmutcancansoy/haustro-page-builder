<div class="ass__hero atr-hero">
  <div class="ass__hero-main">
    <span class="ass__eyebrow">Envanter</span>
    <h1>Aktif Transfer Raporları</h1>
    <p class="ass__hero-sub">Onay bekleyen, yoldaki ve teslim onayı bekleyen transferlerin canlı listesi.</p>
  </div>
  <div class="ass__hero-meta">
    {{#if transfers.length}}
      <span class="ass__chip"><i class="pi pi-send"></i> {{transfers.length}} aktif transfer</span>
    {{else}}
      <span class="ass__chip"><i class="pi pi-send"></i> Aktif transferler</span>
    {{/if}}
  </div>
</div>
